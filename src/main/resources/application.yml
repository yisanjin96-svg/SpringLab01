spring:
  # 기본: 로컬 H2 (파일 모드, 재시작해도 데이터 유지)
  # Postgres로 실행하려면: --spring.profiles.active=postgres
  datasource:
    url: jdbc:h2:file:./data/reservation;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  h2:
    console:
      enabled: true   # http://localhost:8001/h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8001
